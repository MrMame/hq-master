<h2 mat-dialog-title class="dialog-title">Neuen Character erstellen</h2>

<mat-dialog-content>
  <div class="dialog-section">
    <p class="dialog-label">Monstertyp</p>
  </div>
  <div class="monster-list">
    <img src="img/monster-icon-ChaosWarrior.png" alt="" class="monster-image" />
    <img src="img/monster-icon-FimirAbomination.png" alt="" class="monster-image" />
    <img src="img/monster-icon-Gargoyle.png" alt="" class="monster-image" />
    <img src="img/monster-icon-Goblin.png" alt="" class="monster-image" />
    <img src="img/monster-icon-Hexer.png" alt="" class="monster-image" />
    <img src="img/monster-icon-Mummy.png" alt="" class="monster-image" />
    <img src="img/monster-icon-Orc.png" alt="" class="monster-image" />
    <img src="img/monster-icon-Skeleton.png" alt="" class="monster-image" />
    <img src="img/monster-icon-Zombie.png" alt="" class="monster-image" />
  </div>
  <div class="option-row">
    <button mat-button (click)="onOkClick()" class="difficulty-btn">Leicht</button>
    <button mat-button (click)="onOkClick()" class="difficulty-btn">Mittel</button>
    <button mat-button (click)="onOkClick()" class="difficulty-btn">Schwer</button>
    <button mat-button (click)="onOkClick()" class="difficulty-btn">Extrem</button>
  </div>
  <div class="option-row">
    <div class="selectable-color-box selectable-color-box--red"></div>
    <div class="selectable-color-box selectable-color-box--blue"></div>
    <div class="selectable-color-box selectable-color-box--green"></div>
    <div class="selectable-color-box selectable-color-box--pink"></div>
    <div class="selectable-color-box"></div>
    <div class="selectable-color-box selectable-color-box--yellow"></div>
    <div class="selectable-color-box selectable-color-box--dark-yellow"></div>
    <div class="selectable-color-box selectable-color-box--dark-pink"></div>
  </div>
</mat-dialog-content>

<!-- Feste Aktionsleiste für den Abbruch -->
<mat-dialog-actions align="end">
  <button mat-button (click)="onOkClick()" class="dialog-action">Ok</button>
  <button mat-button (click)="onNoClick()" class="dialog-action">Abbrechen</button>
</mat-dialog-actions>
