<div class="minimized-content">
  <div class="minimized-row">
    <img
      draggable="false"
      [src]="character().image"
      [alt]="character().name"
      class="minimized-portrait"
    />
    <button
      (click)="damageRequested.emit(DamageTypes.Normal)"
      class="hit-button hit-button--normal"
    >
      <img draggable="false" src="./img/hit-normal.svg" alt="normal-hit" class="hit-icon" />
    </button>
    <button
      (click)="damageRequested.emit(DamageTypes.Critical)"
      class="hit-button hit-button--critical"
    >
      <img draggable="false" src="./img/hit-critical.svg" alt="critical-hit" class="hit-icon" />
    </button>
  </div>
  <div class="minimized-row">
    <span class="stat stat--health">{{ character().health }}</span>
    <span class="stat stat--armor">{{ character().armor }}</span>
  </div>
</div>
