<div class="character-card">
  @if (character(); as info) {
    <div class="character-card__header">
      <img [src]="info.image" alt="Monster Image" class="character-card__image" />
      <div class="character-card__type">
        <span class="character-card__label">Type: {{ info.type }}</span>
      </div>
    </div>

    <div class="character-card__stats">
      <div class="character-card__stat-row">
        <span class="character-card__label character-card__stat-name">Health:</span>
        <input
          type="number"
          [ngModel]="info.health"
          (ngModelChange)="updateField('health', $event)"
          class="character-card__input"
        />
      </div>

      <div class="character-card__stat-row">
        <span class="character-card__label character-card__stat-name">Defense:</span>
        <input
          type="number"
          [ngModel]="info.defense"
          (ngModelChange)="updateField('defense', $event)"
          class="character-card__input"
        />
      </div>

      <div class="character-card__stat-row">
        <span class="character-card__label character-card__stat-name">Speed:</span>
        <input
          type="number"
          [ngModel]="info.speed"
          (ngModelChange)="updateField('speed', $event)"
          class="character-card__input"
        />
      </div>

      <div class="character-card__stat-row">
        <span class="character-card__label character-card__stat-name">Attack:</span>
        <input
          type="number"
          [ngModel]="info.attack"
          (ngModelChange)="updateField('attack', $event)"
          class="character-card__input"
        />
      </div>
    </div>

    <div class="character-card__section">
      <h3 class="character-card__label">Abilities:</h3>
      <span class="character-card__label">{{ info.abilities.join(', ') }}</span>
    </div>
    <div class="character-card__section">
      <p class="character-card__description">{{ info.description }}</p>
    </div>
  }

  <br />
  <button class="character-card__details-button">Details</button>
</div>
