<div
  class="draggable-box"
  [class.is-on-top]="onTop()"
  cdkDrag
  [cdkDragFreeDragPosition]="{ x: 0, y: 0 }"
  (cdkDragEnded)="onDragEnded($event)"
  [style.left.px]="layout().x"
  [style.top.px]="layout().y"
  (click)="focused.emit()"
>
  <div class="handle" cdkDragHandle (dblclick)="minimiseToggled.emit(); $event.stopPropagation()">
    <span>::: {{ character().name }} :::</span>
  </div>

  @if (layout().isMinimised) {
    <app-character-card-minimised
      [character]="character()"
      (damageRequested)="damageRequested.emit($event)"
    />
  } @else {
    <div class="content">
      <app-character-card
        [character]="character()"
        (characterChange)="characterChange.emit($event)"
      />
      <button
        (click)="removeRequested.emit()"
        class="h-[30px] w-[30px] bg-blue-500 hover:bg-red-700 text-white font-bold rounded"
      >
        DEL
      </button>
    </div>
  }
</div>
