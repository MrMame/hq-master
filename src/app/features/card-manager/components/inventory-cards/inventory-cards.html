<div class="inventory__groups">
  @for (group of groups(); track group.characterId) {
    <section class="inventory__group" [attr.aria-label]="caption() + ' von ' + group.name">
      <h4 class="inventory__owner">{{ group.name }} ({{ group.cards.length }})</h4>
      <div class="inventory__cards">
        @for (entry of group.cards; track entry.deckId + '/' + entry.card.id) {
          @let deck = decksById().get(entry.deckId);
          <app-card-display
            class="card-strip__card"
            [attr.data-testid]="kind() === 'belt' ? 'belt-card' : 'inventory-card'"
            [card]="entry.card"
            [origin]="deck?.name ?? null"
            (cardClick)="view(entry)"
          />
        }
      </div>
    </section>
  }
</div>
