<div class="feature-page">
  <app-collapsible-sidebar>
    <div class="general-sidebar__header">
      <h2 class="general-sidebar__title">Card Manager</h2>
      <app-sidebar-section-toggle-all scope="card-manager" />
    </div>
    <!-- Steht über der Deckliste, damit die Liste beliebig wachsen kann. -->
    <app-sidebar-section title="Deck Management" sectionId="card-manager.deck-management">
      <app-add-deck-form />
    </app-sidebar-section>
    <hr class="general-sidebar__divider" />
    <app-sidebar-section title="Decks" sectionId="card-manager.decks" [count]="decks().length">
      <app-deck-list [decks]="decks()" (selected)="onReveal($event)" />
    </app-sidebar-section>
  </app-collapsible-sidebar>

  <div class="feature-page__main">
    <div class="card-table">
      <app-dm-hand />
      <app-equipped-cards />
      <app-inventory-cards />

      <section class="card-table__decks" aria-label="Spieltisch">
        <h2 class="section-heading">Spieltisch</h2>
        @for (deck of decks(); track deck.id) {
          <app-deck-row
            [deck]="deck"
            [expanded]="expandedDeckId() === deck.id"
            [first]="$first"
            [last]="$last"
            (toggled)="onToggle(deck.id)"
          />
        } @empty {
          <div class="card-table__empty">
            <p class="empty-hint empty-hint--sm">Noch keine Decks auf dem Tisch.</p>
            <app-add-deck-form />
          </div>
        }
      </section>
    </div>
  </div>
</div>
