<div class="card-display" (click)="cardClick.emit(card().id)">
  @if (showFront()) {
    <div class="card-face card-front">
      <img class="card-image" [src]="card().imagePath" [alt]="card().name" />
      <div class="card-info">
        <span class="card-name">{{ card().name }}</span>
        @let combat = asCombat(card());
        @if (combat) {
          <span class="card-stats">ATK {{ combat.attack }} / DEF {{ combat.defense }}</span>
        }
        @if (equipment(); as info) {
          <span class="card-stats card-stats--slot">{{ info.slot }}</span>
          <span class="card-stats">{{ info.modifiers }}</span>
        }
        @if (owner()) {
          <span class="card-owner">Im Besitz von {{ owner() }}</span>
        }
      </div>
    </div>
  } @else {
    <div class="card-face card-back">
      <img class="card-image" [src]="backImagePath()" alt="Kartenrückseite" />
    </div>
  }
</div>
