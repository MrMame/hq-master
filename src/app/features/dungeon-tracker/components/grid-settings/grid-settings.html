<div class="grid-settings">
  <!-- Blendet den ziehbaren Nullpunkt-Marker auf dem Spielbrett ein -->
  <label class="grid-setting__toggle">
    <input
      type="checkbox"
      [checked]="originMode()"
      (change)="onOriginModeChange($event)"
      class="grid-setting__checkbox"
    />
    Nullpunkt verschieben
  </label>

  <!-- Zellgröße: Regler und ±-Buttons, Zahlenfeld für genaue Werte -->
  <div class="grid-setting">
    <app-grid-slider
      name="Zellgröße"
      [valueText]="cellSizeText() + 'px'"
      [value]="boardState().gridCellSizePx"
      [limits]="cellLimits"
      [step]="steps.cellSize"
      (valueChange)="onSlide('gridCellSizePx', $event)"
    />
    <input
      type="number"
      aria-label="Zellgröße"
      [min]="cellLimits.min"
      [max]="cellLimits.max"
      [step]="steps.cellSize"
      [value]="cellSizeValue()"
      (change)="onCellSizeEntered($event)"
      class="grid-setting__number"
    />
  </div>

  <!-- Raster an Bildbreite: für randlose Bilder, z. B. aus dem Dungeon Builder -->
  <div class="grid-setting">
    <label class="grid-setting__field">
      Spalten über Bildbreite
      <span class="grid-setting__row">
        <input
          #columns
          type="number"
          [min]="columnLimits.min"
          [max]="columnLimits.max"
          step="1"
          [value]="boardState().gridColumns"
          class="grid-setting__number"
        />
        <button type="button" class="grid-setting__apply" (click)="onFitColumns(columns.value)">
          Übernehmen
        </button>
      </span>
    </label>
    @if (columnHint(); as hint) {
      <p class="grid-setting__hint" data-testid="grid-columns-hint">{{ hint }}</p>
    }
  </div>

  <app-grid-slider
    name="Nullpunkt X"
    [valueText]="originXText()"
    [value]="boardState().gridOffsetX"
    [limits]="originLimits"
    [step]="steps.origin"
    (valueChange)="onSlide('gridOffsetX', $event)"
  />

  <app-grid-slider
    name="Nullpunkt Y"
    [valueText]="originYText()"
    [value]="boardState().gridOffsetY"
    [limits]="originLimits"
    [step]="steps.origin"
    (valueChange)="onSlide('gridOffsetY', $event)"
  />

  <app-grid-slider
    name="Deckkraft"
    [valueText]="opacityText()"
    [value]="boardState().gridOpacity"
    [limits]="opacityLimits"
    [step]="steps.opacity"
    (valueChange)="onSlide('gridOpacity', $event)"
  />
</div>
