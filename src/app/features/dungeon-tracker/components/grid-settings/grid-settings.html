<div class="grid-settings">
  <!-- Zellgröße: Regler für grobe, Zahlenfeld für genaue Werte -->
  <div class="grid-setting">
    <label class="grid-setting__field">
      Zellgröße: {{ cellSizeText() }}px
      <input
        type="range"
        [min]="cellLimits.min"
        [max]="cellLimits.max"
        step="0.1"
        [value]="boardState().gridCellSizePx"
        (input)="onSlide('gridCellSizePx', $event)"
        class="grid-setting__slider"
      />
    </label>
    <input
      type="number"
      aria-label="Zellgröße"
      [min]="cellLimits.min"
      [max]="cellLimits.max"
      step="0.01"
      [value]="cellSizeValue()"
      (change)="onCellSizeEntered($event)"
      class="grid-setting__number"
    />
  </div>

  <!-- Raster an Bildbreite: für randlose Bilder, z. B. aus dem Dungeon Builder -->
  <div class="grid-setting">
    <label class="grid-setting__field">
      Spalten über Bildbreite
      <span class="grid-setting__row">
        <input
          #columns
          type="number"
          [min]="columnLimits.min"
          [max]="columnLimits.max"
          step="1"
          [value]="boardState().gridColumns"
          class="grid-setting__number"
        />
        <button type="button" class="grid-setting__apply" (click)="onFitColumns(columns.value)">
          Übernehmen
        </button>
      </span>
    </label>
    @if (columnHint(); as hint) {
      <p class="grid-setting__hint" data-testid="grid-columns-hint">{{ hint }}</p>
    }
  </div>

  <label class="grid-setting grid-setting__field">
    Versatz X: {{ boardState().gridOffsetX }}px
    <input
      type="range"
      min="-100"
      max="100"
      step="1"
      [value]="boardState().gridOffsetX"
      (input)="onSlide('gridOffsetX', $event)"
      class="grid-setting__slider"
    />
  </label>

  <label class="grid-setting grid-setting__field">
    Versatz Y: {{ boardState().gridOffsetY }}px
    <input
      type="range"
      min="-100"
      max="100"
      step="1"
      [value]="boardState().gridOffsetY"
      (input)="onSlide('gridOffsetY', $event)"
      class="grid-setting__slider"
    />
  </label>

  <label class="grid-setting grid-setting__field">
    Deckkraft: {{ (boardState().gridOpacity * 100).toFixed(0) }}%
    <input
      type="range"
      min="0"
      max="1"
      step="0.05"
      [value]="boardState().gridOpacity"
      (input)="onSlide('gridOpacity', $event)"
      class="grid-setting__slider"
    />
  </label>
</div>
