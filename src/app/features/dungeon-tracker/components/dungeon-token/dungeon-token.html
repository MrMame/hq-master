<!-- Der Container bewegt Bild, Werteleiste und Menüleiste gemeinsam; gezogen wird nur über das Bild. -->
<div
  #tokenElement
  cdkDrag
  [cdkDragFreeDragPosition]="{ x: 0, y: 0 }"
  [cdkDragScale]="scale()"
  (cdkDragStarted)="dragged = true"
  (cdkDragEnded)="onDragEnd($event)"
  (click)="onClick($event)"
  (dblclick)="tokenDoubleClicked.emit(position().characterId)"
  [style.left.px]="tokenLeft()"
  [style.top.px]="tokenTop()"
  [title]="character().name"
  [class.dungeon-token--selected]="selected()"
  class="dungeon-token"
>
  <div cdkDragHandle class="dungeon-token__portrait">
    @if (character().image) {
      <img
        [src]="character().image"
        [alt]="character().name"
        draggable="false"
        class="dungeon-token__image"
      />
    } @else {
      <div class="dungeon-token__initials">
        {{ initials() }}
      </div>
    }
  </div>

  <app-character-status [character]="character()" class="dungeon-token__status" />

  <!-- Die Menüleiste hält Klicks und Doppelklicks selbst vom Token und vom Spielbrett fern. -->
  @if (selected()) {
    <app-character-action-bar [character]="character()" class="dungeon-token__actions" />
  }
</div>
