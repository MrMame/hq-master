<div class="dungeon-page">
  <!-- Linke Sidebar: Einstellungen, per Griff einklappbar -->
  <app-collapsible-sidebar>
    <div class="general-sidebar__header">
      <h2 class="general-sidebar__title">Dungeon Tracker</h2>
      <app-sidebar-section-toggle-all scope="dungeon-tracker" />
    </div>

    <!-- Charakter-Legende -->
    <app-sidebar-section
      title="Charaktere"
      sectionId="dungeon-tracker.characters"
      [count]="tokens().length"
    >
      @for (token of tokens(); track token.position.characterId) {
        <app-dungeon-legend-entry
          [token]="token"
          [selected]="activeSelection()?.characterId === token.position.characterId"
          [reveal]="activeSelection()?.source === 'board'"
          (damageRequested)="onDamageRequested(token.character, $event)"
          (selectionToggled)="onLegendSelectionToggled(token.position.characterId)"
        />
      }
      @if (tokens().length === 0) {
        <p class="legend-empty">Noch keine Charaktere angelegt.</p>
      }
    </app-sidebar-section>

    <hr class="general-sidebar__divider" />

    <!-- Bild Upload -->
    <app-sidebar-section title="Spielbrett-Foto laden" sectionId="dungeon-tracker.board-image">
      <label class="general-sidebar__button">
        <span>📁 Bild hochladen</span>
        <input type="file" accept="image/*" hidden (change)="onImageUpload($event)" />
      </label>
      @if (boardState().boardImageBase64) {
        <p class="upload-status">✓ Bild geladen</p>
      }
    </app-sidebar-section>

    <hr class="general-sidebar__divider" />

    <!-- Raster-Einstellungen -->
    <app-sidebar-section title="Raster-Einstellungen" sectionId="dungeon-tracker.grid">
      <app-grid-settings [(originMode)]="originMode" />
    </app-sidebar-section>
  </app-collapsible-sidebar>

  <!-- Hauptbereich: Schnellzugriffsleiste im schmalen Streifen links, daneben das Spielbrett (zoombar, scrollt für sich) -->
  <div class="board-area">
    <div class="general-quick-access">
      <button
        type="button"
        class="general-quick-access__button"
        aria-label="Neuer Charakter"
        title="Neuer Charakter"
        (click)="onNewCharacterClick()"
      >
        +
      </button>
      <app-board-zoom-control [(zoom)]="zoom" />
    </div>
    <app-dungeon-board
      [zoom]="zoom()"
      [originMode]="originMode()"
      [selection]="activeSelection()"
      (selectionChange)="onBoardSelectionChange($event)"
    />
  </div>
</div>
