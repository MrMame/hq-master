<div class="dungeon-page">
  <!-- Linke Sidebar: Einstellungen -->
  <aside class="general-sidebar">
    <h2 class="general-sidebar__title">Dungeon Tracker</h2>

    <!-- Charakter-Legende -->
    <div>
      <h3 class="general-sidebar__heading general-sidebar__heading--spaced">
        Charaktere ({{ tokens().length }})
      </h3>
      <button class="general-sidebar__button new-character-button" (click)="onNewCharacterClick()">
        Neuer Charakter
      </button>
      @for (token of tokens(); track token.position.characterId) {
        <app-dungeon-legend-entry
          [token]="token"
          [selected]="activeSelection()?.characterId === token.position.characterId"
          [reveal]="activeSelection()?.source === 'board'"
          (damageRequested)="onDamageRequested(token.character, $event)"
          (selectionToggled)="onLegendSelectionToggled(token.position.characterId)"
        />
      }
      @if (tokens().length === 0) {
        <p class="legend-empty">Noch keine Charaktere angelegt.</p>
      }
    </div>

    <hr class="general-sidebar__divider" />

    <!-- Bild Upload -->
    <div>
      <h3 class="general-sidebar__heading general-sidebar__heading--spaced">
        Spielbrett-Foto laden
      </h3>
      <label class="general-sidebar__button">
        <span>📁 Bild hochladen</span>
        <input type="file" accept="image/*" hidden (change)="onImageUpload($event)" />
      </label>
      @if (boardState().boardImageBase64) {
        <p class="upload-status">✓ Bild geladen</p>
      }
    </div>

    <hr class="general-sidebar__divider" />

    <!-- Raster-Einstellungen -->
    <div>
      <h3 class="general-sidebar__heading general-sidebar__heading--spaced">
        Raster-Einstellungen
      </h3>
      <div class="grid-settings">
        <label class="grid-setting">
          Zoom: {{ (zoom() * 100).toFixed(0) }}%
          <input
            type="range"
            min="1"
            max="4"
            step="0.1"
            [value]="zoom()"
            (input)="zoom.set(+$any($event.target).value)"
            class="grid-setting__slider"
          />
        </label>

        <label class="grid-setting">
          Zellgröße: {{ boardState().gridCellSizePx }}px
          <input
            type="range"
            min="20"
            max="150"
            step="1"
            [value]="boardState().gridCellSizePx"
            (input)="onGridSettingChange('gridCellSizePx', +$any($event.target).value)"
            class="grid-setting__slider"
          />
        </label>

        <label class="grid-setting">
          Versatz X: {{ boardState().gridOffsetX }}px
          <input
            type="range"
            min="-100"
            max="100"
            step="1"
            [value]="boardState().gridOffsetX"
            (input)="onGridSettingChange('gridOffsetX', +$any($event.target).value)"
            class="grid-setting__slider"
          />
        </label>

        <label class="grid-setting">
          Versatz Y: {{ boardState().gridOffsetY }}px
          <input
            type="range"
            min="-100"
            max="100"
            step="1"
            [value]="boardState().gridOffsetY"
            (input)="onGridSettingChange('gridOffsetY', +$any($event.target).value)"
            class="grid-setting__slider"
          />
        </label>

        <label class="grid-setting">
          Deckkraft: {{ (boardState().gridOpacity * 100).toFixed(0) }}%
          <input
            type="range"
            min="0"
            max="1"
            step="0.05"
            [value]="boardState().gridOpacity"
            (input)="onGridSettingChange('gridOpacity', +$any($event.target).value)"
            class="grid-setting__slider"
          />
        </label>
      </div>
    </div>
  </aside>

  <!-- Hauptbereich: Spielbrett (zoombar, scrollt für sich) -->
  <app-dungeon-board
    [zoom]="zoom()"
    [selection]="activeSelection()"
    (selectionChange)="onBoardSelectionChange($event)"
  />
</div>
