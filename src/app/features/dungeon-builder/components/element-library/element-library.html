@if (loadError(); as error) {
  <p class="library__message library__message--error" data-testid="library-error">{{ error }}</p>
} @else if (!catalog()) {
  <p class="library__message">Bibliothek wird geladen …</p>
}

@if (catalog()) {
  <app-library-search [(term)]="search" />

  @if (recent(); as recent) {
    <app-library-group-section
      [group]="recent"
      [activeId]="activeStamp()"
      (picked)="ui.toggleStamp($event)"
      (dragMoved)="dragMoved.emit($event)"
      (dropped)="dropped.emit($event)"
    />
  }

  <!-- Boden: Tipp wählt die Bodenart; Türen und Möbel: ziehen oder per Tipp als Stempel -->
  @for (group of shownGroups(); track group.key) {
    <app-library-group-section
      [group]="group"
      [draggable]="group.key !== floorGroupKey"
      [activeId]="group.key === floorGroupKey ? activeFloor() : activeStamp()"
      [forceExpanded]="searching()"
      (picked)="onPicked(group.key, $event)"
      (dragMoved)="dragMoved.emit($event)"
      (dropped)="dropped.emit($event)"
    />
  } @empty {
    <p class="library__message" data-testid="library-no-results">Keine Elemente gefunden</p>
  }
}
