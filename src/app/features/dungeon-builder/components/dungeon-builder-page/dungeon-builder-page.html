<div class="builder-page">
  <!-- Linke Seitenleiste: Datei, Layout und Bibliothek, per Griff einklappbar -->
  <app-collapsible-sidebar>
    <div class="general-sidebar__header">
      <h2 class="general-sidebar__title">Dungeon Builder</h2>
      <app-sidebar-section-toggle-all scope="dungeon-builder" />
    </div>

    <app-sidebar-section title="Datei" sectionId="dungeon-builder.file">
      <app-builder-file-panel />
    </app-sidebar-section>

    <hr class="general-sidebar__divider" />

    <app-sidebar-section title="Layout" sectionId="dungeon-builder.layout">
      <app-layout-settings />
    </app-sidebar-section>

    <hr class="general-sidebar__divider" />

    <app-element-library
      (dragMoved)="onLibraryDragMoved($event)"
      (dropped)="onLibraryDropped($event)"
    />
  </app-collapsible-sidebar>

  <!-- Hauptbereich: Werkzeugstreifen im schmalen Streifen links, daneben der Plan -->
  <div class="builder-area">
    <app-builder-tool-strip [(zoom)]="zoom" />
    <app-layout-plan [zoom]="zoom()" />
  </div>
</div>
