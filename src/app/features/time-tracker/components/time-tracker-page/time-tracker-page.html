<div class="feature-page">
  <!-- Linke Seitenleiste: Zeit vorrücken, per Griff einklappbar -->
  <app-collapsible-sidebar>
    <div class="general-sidebar__header">
      <h2 class="general-sidebar__title">Time Tracker</h2>
      <app-sidebar-section-toggle-all scope="time-tracker" />
    </div>

    <app-sidebar-section title="Zeit vorrücken" sectionId="time-tracker.time">
      <div class="time-steps">
        <button
          type="button"
          class="general-sidebar__button time-steps__round"
          (click)="startNewRound()"
        >
          Neue Runde
        </button>
        @for (step of timeSteps; track step.name) {
          <button
            type="button"
            class="general-sidebar__button"
            [style.grid-column]="'span ' + step.columns"
            [attr.aria-label]="step.name"
            [title]="step.name"
            [attr.data-testid]="step.testId ?? null"
            (click)="advance(step)"
          >
            {{ step.label }}
          </button>
        }
      </div>
    </app-sidebar-section>
  </app-collapsible-sidebar>

  <!-- Hauptbereich: Spielzeit bleibt oben stehen, nur das Ereignis-Log scrollt -->
  <div class="feature-page__main time-tracker-main">
    <section class="game-time" aria-labelledby="game-time-title">
      <h2 id="game-time-title" class="section-heading">Spielzeit</h2>
      <p class="game-time__value" data-testid="game-time-label">
        {{ gameTimeService.gameTimeAsString() }}
      </p>
    </section>
    <app-active-conditions-list />
    <app-game-log-list />
  </div>
</div>
