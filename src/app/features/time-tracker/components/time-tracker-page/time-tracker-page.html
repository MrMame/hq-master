<p>time-tracker-page works!</p>
<div class="time-tracker-page flex flex-col gap-4 items-start">
  <label class="game-time-label" data-testid="game-time-label">
    Spielzeit: {{ gameTimeService.gameTimeAsString() }}
  </label>
  <div class="flex gap-2">
    @for (step of secondSteps; track step) {
      <button
        class="bg-gray-500 hover:bg-gray-600"
        [attr.data-testid]="'add-seconds-' + step"
        (click)="addSeconds(step)"
      >
        +{{ step }} {{ step === 1 ? 'Second' : 'Seconds' }}
      </button>
    }
  </div>
  <button class="bg-blue-500 hover:bg-blue-600" (click)="addTime1Hour()">+1 Hour</button>
  <button class="bg-green-500 hover:bg-green-600" (click)="addTime8Hour()">+8 Hours</button>
</div>
