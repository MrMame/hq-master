<p>time-tracker-page works!</p>
<div class="time-tracker-page">
  <label class="game-time-label" data-testid="game-time-label">
    Spielzeit: {{ gameTimeService.gameTimeAsString() }}
  </label>
  <div class="time-steps">
    @for (step of secondSteps; track step) {
      <button
        class="time-button time-button--seconds"
        [attr.data-testid]="'add-seconds-' + step"
        (click)="addSeconds(step)"
      >
        +{{ step }} {{ step === 1 ? 'Second' : 'Seconds' }}
      </button>
    }
  </div>
  <button class="time-button time-button--hour" (click)="addTime1Hour()">+1 Hour</button>
  <button class="time-button time-button--hours" (click)="addTime8Hour()">+8 Hours</button>
</div>
