<fieldset class="inventory-editor">
  <legend class="inventory-editor__caption">{{ texts().caption }}</legend>
  @for (entry of cards(); track entry.deckId + '/' + entry.card.id) {
    <!-- Öffnet die Karte im Card Viewer; Aktionen wirken dort erst mit „Übernehmen“. -->
    <button
      type="button"
      class="inventory-editor__card"
      [attr.aria-label]="entry.card.name + ' ansehen'"
      (click)="view.emit({ deckId: entry.deckId, cardId: entry.card.id })"
    >
      <app-card-display class="inventory-editor__image" [card]="entry.card" />
      <span class="inventory-editor__name">{{ entry.card.name }}</span>
    </button>
  } @empty {
    <span class="inventory-editor__empty">{{ texts().empty }}</span>
  }
</fieldset>
