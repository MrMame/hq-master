<h2 mat-dialog-title class="general-dialog__title">{{ title }}</h2>

<mat-dialog-content>
  <form #form="ngForm" class="character-editor__form">
    <!-- Name -->
    <label class="character-editor__field">
      <span class="character-editor__caption">Name</span>
      <input
        name="name"
        required
        class="character-editor__input"
        [ngModel]="draft().name"
        (ngModelChange)="setField('name', $event)"
      />
    </label>

    <hr class="character-editor__divider" />

    <!-- Zahlenwerte (Grundwerte, mit Bonus durch Ausrüstung) -->
    <app-character-stats-editor
      [character]="shown()"
      [cards]="activeCards()"
      (statChange)="setStat($event)"
    />
    <!-- Dynamische Eigenschaften der wirkenden Karten, nur zur Anzeige -->
    <app-character-properties [character]="draft()" [cards]="activeCards()" variant="editor" />

    <hr class="character-editor__divider" />

    <!-- Rundenstand im Dungeon Tracker (Checkbox in Akzentfarbe); „Neue Runde“ hakt ihn aus -->
    <label class="character-editor__checkbox">
      <input
        #moved
        type="checkbox"
        name="movedThisRound"
        [checked]="draft().movedThisRound"
        (change)="setField('movedThisRound', moved.checked)"
      />
      In dieser Runde bewegt
    </label>

    <hr class="character-editor__divider" />

    <!-- Ausrüstung -->
    <app-character-equipment-editor [cards]="draftCards().equipped" (view)="viewCard($event)" />

    <hr class="character-editor__divider" />

    <!-- Gürtel: Eigenschaften wirken wie in einem Slot -->
    <app-character-inventory-editor
      kind="belt"
      [cards]="draftCards().belt"
      (view)="viewCard($event)"
    />

    <hr class="character-editor__divider" />

    <!-- Inventar -->
    <app-character-inventory-editor [cards]="draftCards().inventory" (view)="viewCard($event)" />

    <hr class="character-editor__divider" />

    <!-- Zustände -->
    <app-character-conditions-editor
      [conditions]="draft().conditions"
      (conditionsChange)="setField('conditions', $event)"
    />

    <hr class="character-editor__divider" />

    <!-- Bild -->
    <div class="character-editor__field">
      <span class="character-editor__caption">Bild</span>
      <div
        class="character-editor__images"
        [class.character-editor__images--missing]="!draft().image"
      >
        @for (image of images; track image) {
          <button
            type="button"
            class="character-editor__image-option"
            [class.character-editor__image-option--selected]="image === draft().image"
            [attr.aria-label]="'Bild ' + ($index + 1)"
            [attr.aria-pressed]="image === draft().image"
            (click)="setField('image', image)"
          >
            <img [src]="image" alt="" class="character-editor__image" />
          </button>
        }
      </div>
    </div>

    <hr class="character-editor__divider" />

    <!-- Beschreibung -->
    <label class="character-editor__field">
      <span class="character-editor__caption">Beschreibung</span>
      <textarea
        name="description"
        rows="3"
        class="character-editor__input"
        [ngModel]="draft().description"
        (ngModelChange)="setField('description', $event)"
      ></textarea>
    </label>
  </form>
</mat-dialog-content>

<mat-dialog-actions align="end">
  @if (isEditMode) {
    <button mat-button class="character-editor__remove" (click)="remove()">Entfernen</button>
  } @else {
    <button mat-button class="character-editor__random" (click)="randomize()">
      Zufälliger Charakter erstellen
    </button>
  }
  <button mat-button class="general-dialog__cancel" (click)="cancel()">Abbrechen</button>
  <button
    mat-flat-button
    class="general-dialog__confirm"
    [disabled]="form.invalid || !draft().image"
    (click)="apply()"
  >
    Übernehmen
  </button>
</mat-dialog-actions>
