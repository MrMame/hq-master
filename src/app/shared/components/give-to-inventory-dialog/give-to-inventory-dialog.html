<h2 mat-dialog-title class="general-dialog__title">Ins Inventar geben</h2>

<mat-dialog-content class="give-inventory">
  <p class="give-inventory__card">{{ data.card.name }}</p>

  <fieldset class="give-inventory__group">
    <legend class="give-inventory__caption">Charakter</legend>
    @for (character of data.characters; track character.id) {
      <label class="give-inventory__option">
        <input
          type="radio"
          name="character"
          [value]="character.id"
          [checked]="character.id === characterId()"
          (change)="characterId.set(character.id)"
        />
        <img [src]="character.image" alt="" class="give-inventory__portrait" />
        <span>{{ character.name }}</span>
      </label>
    }
  </fieldset>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button class="general-dialog__cancel" (click)="cancel()">Abbrechen</button>
  <button
    mat-flat-button
    class="general-dialog__confirm"
    [disabled]="!characterId()"
    (click)="confirm()"
  >
    Geben
  </button>
</mat-dialog-actions>
