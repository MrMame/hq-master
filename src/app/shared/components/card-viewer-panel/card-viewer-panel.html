@let viewed = context();
<!-- Leere Flächen um Leiste und Karte gehören zum Hintergrund: Ein Klick dort schließt den Viewer. -->
<div
  class="card-viewer"
  role="dialog"
  aria-modal="true"
  aria-label="Card Viewer"
  cdkTrapFocus
  [cdkTrapFocusAutoCapture]="true"
  (click)="closeOnBackground($event)"
>
  <header class="card-viewer__toolbar" data-testid="card-viewer-toolbar">
    <span class="card-viewer__location" data-testid="card-viewer-location">{{ title() }}</span>
    @if (position(); as pos) {
      <span class="card-viewer__browse">
        <button
          type="button"
          class="card-viewer__tool"
          aria-label="Vorherige Karte"
          title="Vorherige Karte"
          [disabled]="pos.index === 0"
          (click)="step(-1)"
        >
          ‹
        </button>
        <span class="card-viewer__position" data-testid="card-viewer-position"
          >{{ pos.index + 1 }} / {{ pos.total }}</span
        >
        <button
          type="button"
          class="card-viewer__tool"
          aria-label="Nächste Karte"
          title="Nächste Karte"
          [disabled]="pos.index === pos.total - 1"
          (click)="step(1)"
        >
          ›
        </button>
      </span>
    }
    <button
      type="button"
      class="card-viewer__tool card-viewer__tool--text"
      [attr.aria-pressed]="side() === 'back'"
      (click)="flip()"
    >
      Umdrehen
    </button>
    <span class="card-viewer__actions">
      <button
        type="button"
        class="card-viewer__tool card-viewer__tool--text"
        [attr.aria-expanded]="menu.expanded()"
        (click)="menu.toggle()"
      >
        Aktionen
      </button>
      <!-- Liegt über der Karte; Zuklappen entfernt das Menü und damit offene Untermenü-Ebenen. -->
      @if (menu.expanded()) {
        <app-card-action-menu
          class="card-viewer__menu"
          [entries]="entries()"
          [cardKey]="cardKey()"
          (run)="run($event)"
        />
      }
    </span>
    <button
      type="button"
      class="card-viewer__tool"
      aria-label="Schließen"
      title="Schließen"
      (click)="closed.emit()"
    >
      ×
    </button>
  </header>
  <div class="card-viewer__stage">
    <!-- Öffnet mit der Vorderseite, auch im Nachziehstapel; ein Klick auf die Karte löst nichts aus. -->
    <app-card-display class="card-viewer__card" [card]="viewed.card" [side]="side()" />
  </div>
</div>
