<div class="character-editor__stats">
  @for (field of fields(); track field.key) {
    <div class="character-editor__stat">
      <label class="character-editor__field">
        <span class="character-editor__caption">{{ field.key }}</span>
        <input
          type="number"
          required
          class="character-editor__input"
          [class.character-editor__input--base]="field.bonus"
          [name]="field.key"
          [min]="field.min"
          [ngModel]="field.value"
          (ngModelChange)="change(field, $event)"
        />
      </label>
      <!-- Außerhalb des Labels, damit der Feldname nur die Beschriftung bleibt -->
      @if (field.bonus; as bonus) {
        <span
          class="character-editor__breakdown"
          [attr.data-testid]="'stat-bonus-' + field.key"
          [title]="bonus.sources"
          ><span
            class="character-editor__bonus"
            [class.character-editor__bonus--negative]="!bonus.positive"
            >{{ bonus.bonus }}</span
          >
          = <span class="character-editor__effective">{{ bonus.effective }}</span></span
        >
      }
    </div>
  }
</div>
