<div class="card-display" (click)="cardClick.emit(card().id)">
  <div class="card-face" [class.card-front]="showFront()" [class.card-back]="!showFront()">
    @if (failed()) {
      <div class="card-placeholder" role="img" [attr.aria-label]="alt()">
        @if (showFront()) {
          <span class="card-placeholder__name">{{ card().name }}</span>
        }
      </div>
    } @else {
      <img class="card-image" [src]="src()" [alt]="alt()" (error)="markFailed()" />
    }
  </div>
  @if (captioned()) {
    <div class="card-caption">
      @if (owner()) {
        <span class="card-owner">Im Besitz von {{ owner() }}</span>
      }
      @if (origin()) {
        <span class="card-origin">aus {{ origin() }}</span>
      }
    </div>
  }
</div>
