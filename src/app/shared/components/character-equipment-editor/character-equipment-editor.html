<fieldset class="equipment-editor">
  <legend class="equipment-editor__caption">Ausrüstung</legend>
  @for (row of rows(); track row.slot) {
    <div class="equipment-editor__slot">
      <span class="equipment-editor__label">{{ row.label }}</span>
      @if (row.entry; as entry) {
        <img [src]="entry.card.imagePath" alt="" class="equipment-editor__image" />
        <span class="equipment-editor__name">{{ entry.card.name }}</span>
        <button
          type="button"
          class="equipment-editor__discard"
          [attr.aria-label]="entry.card.name + ' ablegen'"
          (click)="discard.emit(entry.card.id)"
        >
          Ablegen
        </button>
      } @else {
        <span class="equipment-editor__free">frei</span>
      }
    </div>
  }
</fieldset>
