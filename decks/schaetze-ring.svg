<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 100">
  <rect width="120" height="100" fill="#1c0000"/>
  <!-- Ring Außen -->
  <circle cx="60" cy="52" r="32" fill="#92400e" stroke="#d97706" stroke-width="3"/>
  <!-- Ring Innen (Loch) -->
  <circle cx="60" cy="52" r="20" fill="#1c0000"/>
  <!-- Ring Glanz -->
  <path d="M35 35 Q60 20 85 35" fill="none" stroke="#fbbf24" stroke-width="3" stroke-linecap="round" opacity="0.8"/>
  <!-- Fluch-Symbol -->
  <path d="M60 52 m-8,0 a8,8 0 1,0 16,0 a8,8 0 1,0 -16,0" fill="none" stroke="#ef4444" stroke-width="1" stroke-dasharray="3 2"/>
  <!-- Fluch Rune -->
  <text x="60" y="57" text-anchor="middle" font-size="12" fill="#ef4444">⚷</text>
  <!-- Stein in Ring -->
  <ellipse cx="60" cy="24" rx="8" ry="6" fill="#7f1d1d" stroke="#ef4444" stroke-width="1.5"/>
  <ellipse cx="60" cy="23" rx="5" ry="3.5" fill="#dc2626" opacity="0.9"/>
  <!-- Verfluchter Rauch -->
  <path d="M45 70 Q42 80 45 90" stroke="#6b7280" stroke-width="1.5" fill="none" stroke-dasharray="3 2"/>
  <path d="M75 70 Q78 80 75 90" stroke="#6b7280" stroke-width="1.5" fill="none" stroke-dasharray="3 2"/>
</svg>
