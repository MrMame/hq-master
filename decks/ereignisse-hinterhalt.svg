<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 100">
  <rect width="120" height="100" fill="#0f1a0f"/>
  <!-- Bäume / Schatten -->
  <rect x="0" y="20" width="20" height="80" fill="#14532d"/>
  <rect x="100" y="20" width="20" height="80" fill="#14532d"/>
  <triangle points="10,20 0,60 20,60" fill="#166534"/>
  <!-- Silhouetten der Räuber -->
  <ellipse cx="28" cy="55" rx="6" ry="6" fill="#1f2937"/>
  <rect x="23" y="61" width="10" height="20" rx="2" fill="#1f2937"/>
  <ellipse cx="92" cy="52" rx="6" ry="6" fill="#1f2937"/>
  <rect x="87" y="58" width="10" height="20" rx="2" fill="#1f2937"/>
  <!-- Glänzende Augen -->
  <circle cx="26" cy="54" r="1.5" fill="#ef4444"/>
  <circle cx="30" cy="54" r="1.5" fill="#ef4444"/>
  <circle cx="90" cy="51" r="1.5" fill="#ef4444"/>
  <circle cx="94" cy="51" r="1.5" fill="#ef4444"/>
  <!-- Weg -->
  <rect x="35" y="60" width="50" height="40" fill="#292524"/>
  <!-- Ausrufezeichen-Warnung -->
  <text x="60" y="48" text-anchor="middle" font-size="24" fill="#ef4444" font-weight="bold">!</text>
</svg>
